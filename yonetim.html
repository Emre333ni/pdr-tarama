    var notes = (rec.notes || []).map(function (n, i) { return '<div class="m">📌 Not ' + (i + 1) + ' · ' + fnum(n.dist, 0) + ' m: ' + esc(n.text || '(fotoğraf)') + '</div>'; }).join('');
    $('aview').innerHTML = '<div class="card"><b>' + esc(r.title || rec.name || 'Rota') + '</b><div class="m">' + esc(r.username) + ' · ' + dt(r.created_at) + ' · ' + fnum(sn.dist, 1) + ' m · ' + sn.steps + ' adım · başlangıç ' + (+rec.origin.lat).toFixed(6) + ', ' + (+rec.origin.lng).toFixed(6) + '</div><canvas class="sk" id="skc"></canvas>' +
      (rows ? '<table class="t"><tr><th>#</th><th>Yön</th><th>Açı</th><th>Metre</th></tr>' + rows + '</table>' : '<div class="m">Dönemeç yok.</div>') + notes + '<button id="aclose">Kapat</button></div>';
    sketch($('skc'), rec); $('aclose').onclick = function () { $('aview').innerHTML = ''; };
    try { $('aview').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { /* yok say */ }
    window.CUR = { id: id, rec: rec, title: r.title };
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-r]'); if (!b) return; var id = +b.dataset.id, k = b.dataset.r;
  if (k === 'v') return archView(id);
  if (k === 'd') { if (!confirm('Bu rota arşivden silinsin mi?')) return; call2('route_del', { id: id }).then(function (r) { if (!r.ok) $('me').textContent = r.err || 'Hata'; $('aview').innerHTML = ''; archLoad(); }); return; }
  call2('route', { id: id }).then(function (r) {
    if (!r.ok) { $('me').textContent = r.err || 'Hata'; return; }
    var nm = String(r.title || 'rota').replace(/[^A-Za-z0-9ÇĞİÖŞÜçğıöşü_-]+/g, '_').slice(0, 40);
    if (k === 'j') saveBlob('bozkurt-' + nm + '.json', 'application/json', JSON.stringify(r.data, null, 1)); else saveBlob('bozkurt-' + nm + '.gpx', 'application/gpx+xml', gpxOf(r.data, r.title || 'Rota'));
  });
});
