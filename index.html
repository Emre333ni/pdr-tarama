<style>
/* Yerleşim: yeraltı ölçü defteri. Üstte harita, altında büyük rakamlı HUD, sonra dönemeç günlüğü ve ayar panelleri.
   Tek bir koyu görünüm: tünelde göz yormaz, el feneri sarısı tek vurgu. */
:root {
  --bg: #0a0f18; --panel: #111826; --panel2: #172032; --line: #26324a;
  --ink: #e6ebf2; --mute: #8b97ab; --lamp: #ffb81c; --lamp-ink: #1a1300;
  --ref: #7fb6ff; --warn: #ff7a66; --ok: #8bd17c;
  --f-disp: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  padding-block: 10px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font: 700 26px/1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; }
.top h1 small { font: 500 12px var(--f-mono); letter-spacing: .08em; color: var(--mute); margin-left: 8px; text-transform: none; }
.hdr-r { display: flex; gap: 6px; align-items: center; }
.chip { font: 500 11px var(--f-mono); letter-spacing: .08em; padding: 4px 8px; border: 1px solid var(--line); border-radius: 3px; color: var(--mute); white-space: nowrap; }
.chip.live { color: var(--lamp-ink); background: var(--lamp); border-color: var(--lamp); }
.chip.sim { color: var(--ref); border-color: var(--ref); }

.mapwrap { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
#map { height: clamp(300px, 46vh, 520px); width: 100%; background: #080c14; }
#sketch { display: block; width: 100%; height: clamp(300px, 46vh, 520px); }
.mapbtns { position: absolute; z-index: 1000; top: 8px; right: 8px; display: flex; flex-direction: column; flex-wrap: wrap-reverse; align-content: flex-start; max-height: calc(100% - 16px); gap: 4px; }
.mapbtns button { width: 36px; height: 36px; border: 1px solid var(--line); background: rgba(13,16,18,.88); border-radius: 3px; cursor: pointer; font: 500 16px var(--f-mono); line-height: 1; }
.mapbtns button[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
.maptag { position: absolute; z-index: 1000; left: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; pointer-events: none; }
.maptag span { font: 500 11px var(--f-mono); letter-spacing: .06em; padding: 3px 7px; background: rgba(13,16,18,.9); border: 1px solid var(--line); border-radius: 3px; }
.maptag .sim { color: var(--ref); border-color: var(--ref); }
.maptag .warn { color: var(--warn); border-color: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font: 400 11px var(--f-mono); color: var(--mute); padding: 0 2px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--lamp); vertical-align: middle; margin-right: 6px; }
.legend i.ref { border-top: 2px dashed var(--ref); }

.bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bar .primary { grid-column: 1 / -1; }
.btn { min-height: 46px; border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; padding: 0 14px; cursor: pointer; font-weight: 600; letter-spacing: .02em; }
.btn:hover { border-color: var(--mute); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); font: 700 17px var(--f-disp); letter-spacing: .08em; text-transform: uppercase; min-height: 52px; }
.btn.stop { border-color: var(--warn); color: var(--warn); }

.hud { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.tile .v { display: flex; align-items: baseline; gap: 6px; }
.tile b { font: 600 44px/1 var(--f-disp); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.tile i { font: 500 13px var(--f-mono); color: var(--mute); font-style: normal; }
.tile.main b { color: var(--lamp); }
.tile .dial { width: 38px; height: 38px; margin-left: auto; align-self: center; }
.tile .dial svg { width: 100%; height: 100%; transition: transform .12s linear; }
.sub { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 12px var(--f-mono); color: var(--mute); padding: 0 2px; }
.sub b { color: var(--ink); font-weight: 500; }

.coords { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; }
.coords .k { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.coords .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.coords code { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; user-select: all; }
.mini { min-height: 32px; padding: 0 10px; font: 500 12px var(--f-mono); border: 1px solid var(--line); background: var(--panel2); border-radius: 3px; cursor: pointer; }

h2 { margin: 6px 0 0; font: 600 15px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.log .now { padding: 10px 12px; border-bottom: 1px solid var(--line); font: 400 13px var(--f-mono); color: var(--mute); }
.log .now b { color: var(--ink); font-weight: 500; }
.log .now.turning { color: var(--lamp); }
.log ol { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 30px 64px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log .n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--lamp); display: grid; place-items: center; font: 500 12px var(--f-mono); }
.log .dir { font: 700 18px var(--f-disp); letter-spacing: .06em; }
.log .dir.r { color: var(--lamp); } .log .dir.l { color: var(--ref); }
.log .ang { font: 600 22px var(--f-disp); }
.log .d1 { display: flex; align-items: baseline; gap: 10px; }
.log .d2 { grid-column: 3; font: 400 12px var(--f-mono); color: var(--mute); }
.log .empty { padding: 14px 12px; color: var(--mute); font-size: 14px; }

details { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
summary { cursor: pointer; padding: 12px; font: 600 15px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "+"; font: 500 16px var(--f-mono); color: var(--mute); }
details[open] summary::after { content: "–"; }
summary::-webkit-details-marker { display: none; }
.pbody { padding: 0 12px 14px; display: grid; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.field input, .field select, .field textarea { min-height: 42px; width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font-family: var(--f-mono); font-size: 14px; }
.field textarea { min-height: 64px; resize: vertical; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--lamp); }
.note { font-size: 13px; color: var(--mute); margin: 0; }
.depth { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.depth .k { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.depth .dhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.depth .drow { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.depth .drow b { font: 600 44px/1 var(--f-disp); font-variant-numeric: tabular-nums; color: var(--ref); }
.depth .drow i { font: 500 13px var(--f-mono); color: var(--mute); font-style: normal; }
.depth canvas { width: 100%; height: 130px; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; }
.depth .dstats { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 12px var(--f-mono); color: var(--mute); }
.depth .dstats b { color: var(--ink); font-weight: 500; }
.note b { color: var(--ink); font-weight: 600; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.status { font: 400 12px var(--f-mono); color: var(--mute); overflow-wrap: anywhere; }
.status.bad { color: var(--warn); }
.status.good { color: var(--ok); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 3000; max-width: min(92vw, 520px); background: var(--panel2); border: 1px solid var(--lamp); padding: 10px 14px; border-radius: 4px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.tm { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 2px solid var(--lamp); color: var(--ink); display: grid; place-items: center; font: 500 12px var(--f-mono); }
.tm.l { border-color: var(--ref); }

/* kalibrasyon sihirbazı, rota özeti, tanılama */
.btn.cal { border-color: var(--lamp); color: var(--lamp); }
.wiz { background: var(--panel); border: 1px solid var(--lamp); border-radius: 4px; padding: 14px 12px; display: grid; gap: 10px; }
.wiz .st { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--lamp); }
.wiz h3 { margin: 0; font: 700 26px/1.1 var(--f-disp); letter-spacing: .03em; }
.wiz p { margin: 0; font-size: 15px; }
.wbar { height: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.wbar i { display: block; height: 100%; width: 0; background: var(--lamp); }
.wlive { font: 500 15px var(--f-mono); min-height: 22px; font-variant-numeric: tabular-nums; }
.wres { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font: 400 13px var(--f-mono); }
.wres li.ok { color: var(--ok); } .wres li.bad { color: var(--warn); } .wres li.info { color: var(--mute); }
.wbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wbtns .full { grid-column: 1 / -1; }
.log ol.tl li { grid-template-columns: 30px minmax(0, 1fr); }
.tl .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--lamp); display: grid; place-items: center; font: 500 12px var(--f-mono); }
.tl .turn { background: var(--panel2); }
.tl .turn .dot { border: 0; font-size: 22px; }
.tl .turn.r .dot, .tl .turn.r b { color: var(--lamp); } .tl .turn.l .dot, .tl .turn.l b { color: var(--ref); }
.tl b { font: 700 20px var(--f-disp); letter-spacing: .03em; }
.tl .meta { font: 400 12px var(--f-mono); color: var(--mute); }
.tl .live b::after { content: " · şimdi"; font: 500 11px var(--f-mono); color: var(--lamp); letter-spacing: .04em; }
.logfoot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
pre.diag { margin: 0; font: 400 12px/1.5 var(--f-mono); color: var(--mute); white-space: pre-wrap; overflow-wrap: anywhere; }
.leglabw { background: none; border: 0; }
.mapbtn { display: grid; place-items: center; text-decoration: none; color: var(--ink); text-align: center; padding: 8px 14px; }
.leglab { position: absolute; transform: translate(-50%, -50%); background: rgba(13,16,18,.92); color: var(--ink); border: 1px solid var(--lamp); border-radius: 3px; font: 500 11px var(--f-mono); padding: 1px 5px; white-space: nowrap; }

/* --- Leaflet 1.9 çekirdek stilleri (CSS dosyası CSP gereği gömülü) --- */
.leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
.leaflet-container { overflow: hidden; -webkit-tap-highlight-color: transparent; outline-offset: 1px; font: 12px/1.5 var(--f-mono); }
.leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
.leaflet-tile::selection { background: transparent; }

.leaflet-safari .leaflet-tile-container { width: 1600px; height: 1600px; -webkit-transform-origin: 0 0; }
.leaflet-marker-icon, .leaflet-marker-shadow { display: block; }
.leaflet-container .leaflet-overlay-pane svg { max-width: none !important; max-height: none !important; }
.leaflet-container .leaflet-marker-pane img, .leaflet-container .leaflet-shadow-pane img, .leaflet-container .leaflet-tile-pane img, .leaflet-container img.leaflet-image-layer, .leaflet-container .leaflet-tile { max-width: none !important; max-height: none !important; width: auto; padding: 0; }

.leaflet-tile-loaded { visibility: inherit; }
.leaflet-zoom-box { width: 0; height: 0; box-sizing: border-box; z-index: 800; }
.leaflet-pane { z-index: 400; }
.leaflet-tile-pane { z-index: 200; } .leaflet-overlay-pane { z-index: 400; } .leaflet-shadow-pane { z-index: 500; }

.leaflet-map-pane canvas { z-index: 100; } .leaflet-map-pane svg { z-index: 200; }
.leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; }
.leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
.leaflet-top { top: 0; } .leaflet-right { right: 0; } .leaflet-bottom { bottom: 0; } .leaflet-left { left: 0; }
.leaflet-right .leaflet-control { float: right; }
.leaflet-bottom .leaflet-control { margin-bottom: 8px; }
.leaflet-left .leaflet-control { margin-left: 8px; }
.leaflet-right .leaflet-control { margin-right: 8px; }
.leaflet-zoom-animated { -webkit-transform-origin: 0 0; transform-origin: 0 0; }

.leaflet-interactive { cursor: pointer; }
.leaflet-grab { cursor: grab; }
.leaflet-dragging .leaflet-grab, .leaflet-dragging .leaflet-grab .leaflet-interactive, .leaflet-dragging .leaflet-marker-draggable { cursor: move; }
.leaflet-touch-zoom { touch-action: pan-x pan-y; } .leaflet-touch-drag { touch-action: none; } .leaflet-touch-drag.leaflet-touch-zoom { touch-action: none; }
.leaflet-marker-icon.tmwrap { background: none; border: 0; }
.leaflet-control-scale-line { padding: 1px 6px; color: var(--ink); background: rgba(13,16,18,.85); border: 1px solid var(--mute); border-top: 0; white-space: nowrap; box-sizing: border-box; }
#map.grid { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; }

@media (min-width: 640px) { .hud { grid-template-columns: repeat(4, minmax(0, 1fr)); } .tile b { font-size: 40px; } }
@media (prefers-reduced-motion: reduce) { .tile .dial svg { transition: none; } }

</style>

<style>
/* BOZKURT giriş: tam ekran video + giriş kartı. Uygulamayı beklemez: arkada yüklenir, her an atlanabilir. */
html.locked .wrap { visibility: hidden; }
.gate { position: fixed; inset: 0; z-index: 99999; background: #05080f; color: #e6ebf2; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  min-height: 100vh; min-height: 100dvh; transition: opacity .45s ease, transform .45s ease; font-family: var(--f-body, system-ui, sans-serif); }
.gate.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.gate video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
.gate video { animation: gateZoom 4.5s ease-out both; transform-origin: 50% 40%; }
.gate .brand .mark { animation: gatePulse 2.2s ease-in-out infinite alternate; }
@keyframes gateZoom { from { transform: scale(1.0); opacity: .85; } to { transform: scale(1.09); opacity: 1; } }
@keyframes gatePulse { from { text-shadow: 0 0 14px rgba(255,150,40,.25), 0 2px 0 rgba(0,0,0,.4); } to { text-shadow: 0 0 40px rgba(255,150,40,.85), 0 2px 0 rgba(0,0,0,.4); } }
.gate .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,8,15,.55) 0%, rgba(5,8,15,0) 28%, rgba(5,8,15,0) 52%, rgba(5,8,15,.88) 100%); pointer-events: none; }
.gate .skip { position: absolute; z-index: 3; bottom: max(22px, env(safe-area-inset-bottom, 0px) + 14px); right: 14px; min-height: 36px; padding: 0 14px; border: 1px solid rgba(230,235,242,.35); background: rgba(5,8,15,.45); color: #e6ebf2; border-radius: 3px; font: 500 12px var(--f-mono, monospace); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.gate .brand { position: relative; z-index: 2; padding: max(26px, env(safe-area-inset-top, 0px) + 18px) 22px 0; text-align: left; animation: gateIn .9s .25s both; }
.gate .brand .mark { font: 700 clamp(46px, 15vw, 84px)/0.95 var(--f-disp, "Arial Narrow", sans-serif); letter-spacing: .14em; color: #ffb81c; text-shadow: 0 0 28px rgba(255,150,40,.55), 0 2px 0 rgba(0,0,0,.4); }
.gate .brand .sub { margin-top: 8px; font: 500 12px var(--f-mono, monospace); letter-spacing: .16em; text-transform: uppercase; color: #b9c4d6; }
.gate .card { position: relative; z-index: 2; margin: 0 auto; width: min(100%, 460px); padding: 18px 18px max(22px, env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-direction: column; gap: 10px; animation: gateUp .55s both; }
.gate .card label { display: flex; flex-direction: column; gap: 4px; font: 500 11px var(--f-mono, monospace); letter-spacing: .1em; text-transform: uppercase; color: #9fb0c8; }
.gate .card input[type=text], .gate .card input[type=password] { min-height: 46px; padding: 8px 12px; border: 1px solid rgba(160,180,210,.35); border-radius: 3px; background: rgba(8,12,20,.72); color: #f2f5fa; font: 500 16px var(--f-body, system-ui, sans-serif); letter-spacing: .02em; text-transform: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.gate .card input:focus-visible { outline: 2px solid #ffb81c; outline-offset: 1px; }
.gate .card .rem { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: .02em; font: 400 13px var(--f-body, system-ui, sans-serif); color: #b9c4d6; }
.gate .card .go { min-height: 48px; border: 0; border-radius: 3px; background: #ffb81c; color: #1a1300; font: 700 18px var(--f-disp, "Arial Narrow", sans-serif); letter-spacing: .18em; cursor: pointer; }
.gate .card .go:disabled { opacity: .55; }
.gate .err { min-height: 18px; margin: 0; font: 500 12px var(--f-mono, monospace); color: #ff8a78; }
.gate .card.shake { animation: gateShake .35s; }
@keyframes gateIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
